[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finterminal"
version = "0.1.1"
description = "Local-first AI financial research infrastructure built around MCP, quantitative analysis, RAG, agentic research, and auditable data provenance."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [
  { name = "Lucas Chang" },
]
keywords = [
  "finance",
  "mcp",
  "model-context-protocol",
  "quantitative-finance",
  "rag",
  "agentic-research",
  "data-provenance",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "fastmcp>=2.0",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.0",
  "pandas>=2.2",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "pdfplumber>=0.11",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "reportlab>=4.2",
  "msoffcrypto-tool>=5.4",
  "olefile>=0.47",
  "cryptography>=43",
  "keyring>=25",
  "requests>=2.32",
  "openai>=1.40",
  "matplotlib>=3.9",
  "scipy>=1.13",
  "statsmodels>=0.14",
]

[project.urls]
Homepage = "https://github.com/lucaschang2021/finterminal"
Repository = "https://github.com/lucaschang2021/finterminal"
Issues = "https://github.com/lucaschang2021/finterminal/issues"
Changelog = "https://github.com/lucaschang2021/finterminal/blob/main/CHANGELOG.md"

[project.optional-dependencies]
market = [
  "akshare>=1.14",
  "yfinance>=0.2.40",
]
kb = [
  "chromadb>=0.5",
  "sentence-transformers>=3.0",
  "rank-bm25>=0.2",
  "jieba>=0.42",
]
vision = [
  "rapidocr-onnxruntime>=1.4",
]
charts = [
  "plotly>=5.24",
  "wordcloud>=1.9",
  "jieba>=0.42",
  "squarify>=0.4",
]
llm = [
  "transformers>=4.40",
]
anchor = [
  "rfc3161ng>=2.1",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "pip-audit>=2.7",
  "httpx>=0.27",
]
all = [
  "akshare>=1.14",
  "yfinance>=0.2.40",
  "chromadb>=0.5",
  "sentence-transformers>=3.0",
  "rank-bm25>=0.2",
  "jieba>=0.42",
  "rapidocr-onnxruntime>=1.4",
  "plotly>=5.24",
  "wordcloud>=1.9",
  "squarify>=0.4",
  "transformers>=4.40",
  "rfc3161ng>=2.1",
]

[tool.setuptools]
py-modules = [
  "mcp_server", "api_server", "reader", "routing", "paths",
  "analysis", "charts", "chart_data", "data_chain", "knowledge",
  "market_data", "plugin_manager", "backtest", "local_llm",
  "vision_ocr", "export_utils", "excel_utils", "crypto_utils",
  "set_api_key",
]

[tool.ruff]
target-version = "py313"
line-length = 140
exclude = [
  "__pycache__",
  "tests",
  "plugins",
  "finterminal-desktop/node_modules",
  "finterminal-desktop/build",
  "finterminal-desktop/dist",
  "finterminal-desktop/release",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "PIE", "RUF", "SIM"]
ignore = [
  "BLE001",
  "S110",
  "S112",
  "DTZ005",
  "RUF013",
  "RUF001",
  "RUF002",
  "RUF003",
  "E501",
  "E702",
  "S310",
  "S324",
  "SIM103",
  "SIM105",
  "B905",
  "RUF005",
]
